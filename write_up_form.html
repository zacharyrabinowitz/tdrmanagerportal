<!DOCTYPE html>
<html>
<head>
    <title>Write-up Form</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #747679;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand {
            color: rgb(4, 0, 255);
        }
        .container {
            padding-top: 20px;
        }
        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .write-up-list {
            list-style-type: none;
            padding: 0;
        }
        .write-up-item {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .action-buttons {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">The Draft Room Manager Portal: Human Resources</a>
            <div class="navbar-nav ml-auto">
                <a class="btn btn-danger" href="/logout" role="button">Logout</a>
                <a href="/user-links" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2>Write-up Form</h2>
            <form action="{{ url_for('submit_writeup') }}" method="post">
                <label for="employee_name">Employee Name:</label>
                <input type="text" id="employee_name" name="employee_name" required><br>
            
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required><br>
            
                <label for="reason">Reason:</label>
                <textarea id="reason" name="reason" rows="4" cols="50" required></textarea><br>
            
                <button type="submit">Submit</button>
            </form>
        </div>
        <div class="back-button">
            <a href="/user-links" class="btn btn-secondary">Back to Home</a>
        <h3>Previous Write-ups</h3>
        <ul class="write-up-list">
            {% for write_up in write_ups %}
                <li class="write-up-item">
                    <strong>{{ write_up['employee_name'] }}</strong>: {{ write_up['reason'] }} - {{ write_up['details'] }}
                    <div class="action-buttons">
                        <form method="POST" action="/write-up" style="display: inline;">
                            <input type="hidden" name="action_id" value="{{ write_up['id'] }}">
                            <form action="{{ url_for('approve_write_up', write_up_id=write_up.id) }}" method="POST">
                                <input type="hidden" name="write_up_id" value="{{ write_up.id }}">
                                <button type="submit" class="btn btn-success">Approve</button>
                            </form>
                            <form action="{{ url_for('deny_write_up', write_up_id=write_up.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to deny this write-up?');">
                                <input type="hidden" name="write_up_id" value="{{ write_up.id }}">
                                <button type="submit" class="btn btn-danger">Deny</button>
                            </form>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
