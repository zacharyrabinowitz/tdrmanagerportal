<!DOCTYPE html>
<html>
<head>
    <title>Delete Member</title>
    <!-- Add your CSS styling here -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .confirmation-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        .btn-delete {
            background: #dc3545;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            width: 100px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #c82333;
        }
        .btn-cancel {
            background: #007bff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            width: 100px;
            cursor: pointer;
            margin-left: 20px;
        }
        .btn-cancel:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h2>Delete Member</h2>
        <p>Are you sure you want to delete this member?</p>
        <form method="POST">
            <button type="submit" class="btn btn-delete">Delete</button>
            <a href="/members" class="btn btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
