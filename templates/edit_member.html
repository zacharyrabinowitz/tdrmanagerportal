<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Member</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        .form-control {
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .btn-save {
            background: #007bff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            color: white;
            width: 20%;
            cursor: pointer;
        }
        .btn-save:hover {
            background: #0056b3;
        }
        .body {
            background-color: #f7f7f7;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #343a40;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand {
            color: #ffffff;
            font-weight: bold;
        }
        .container {
            padding-top: 40px;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: auto;
        }
        .form-control {
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .btn-primary, .btn-danger {
            background: #ff0000;
            border: center;
            border-radius: 10px;
            padding: 10px 20px;
            color: white;
            width: 20%;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center">Edit Member</h2>
        <form action="{{ url_for('edit_member', member_id=member.id) }}" method="post">
            <div class="form-group">
                <label for="first_name">First Name:</label>
                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ member.first_name }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name:</label>
                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ member.last_name }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ member.email }}" required>
            </div>
            <div class="form-group">
                <label for="membership_level">Membership Level:</label>
                <select class="form-control" id="membership_level" name="membership_level">
                    <option value="Single" {% if member.member_level == 'Single' %}selected{% endif %}>Single Membership</option>
                </select>
            </div>
            <button type="submit" class="btn btn-save"><i class="fas fa-check"></i>Update</button>
            <a href="/members" class="btn btn-danger"><i class="fas fa-times"></i> Cancel</a>
        </form>
    </div>
</body>
</html>
