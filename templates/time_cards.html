<!DOCTYPE html>
<html>
<head>
    <title>Time Card Management - The Draft Room</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #747679;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand, .navbar-custom .navbar-nav .nav-link {
            color: rgb(4, 0, 255);
        }
        .container {
            padding-top: 20px;
        }
        .link-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .link-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .dashboard-link {
            color: #007bff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .dashboard-row {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">The Draft Room Time Cards</a>
            <div class="navbar-nav ml-auto">
                <a class="btn btn-danger" href="/logout" role="button">Logout</a>
                <a href="/user-links" class="btn btn-primary">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Additional content can go here, like a greeting or instructions -->
        <div class="row dashboard-row">
            <div class="col-md-12">
                <div class="link-box">
                    <h2 class="text-center">Time Card Management</h2>
                    <p>Manage weekly time cards for employees. Select a week to view, edit, or delete entries.</p>
                </div>
            </div>
        </div>
        <div class="row dashboard-row">
            <div class="col-md-4">
                <a href="/time_cards/week" class="link-box dashboard-link">View This Week's Time Cards</a>
            </div>
            <div class="col-md-4">
                <a href="/clock" class="link-box dashboard-link">Add New Time Card</a>
            </div>
            <div class="col-md-4">
                <a href="/time_cards/manage" class="link-box dashboard-link">Manage Employees</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
