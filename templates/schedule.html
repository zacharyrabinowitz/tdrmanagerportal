<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shift Scheduling</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js'></script>
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #343a40;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand, .navbar-custom .navbar-nav .nav-link {
            color: #ffffff;
        }
        .container {
            padding-top: 20px;
        }
        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-box h2 {
            color: #343a40;
        }
        .btn-custom {
            background-color: #17a2b8;
            color: white;
        }
        .btn-custom:hover {
            background-color: #138496;
        }
        .form-control:focus {
            box-shadow: 0 0 5px rgba(23, 162, 184, 0.5);
            border-color: #17a2b8;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-alt"></i> The Draft Room Manager Portal: Shift Scheduling</a>
            <div class="navbar-nav ml-auto">
                <a href="{{ url_for('login') }}" class="btn btn-danger nav-link"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                <a href="{{ url_for('user_links') }}" class="btn btn-primary nav-link"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2>Schedule a New Shift</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="employee_name">Employee Name:</label>
                    <input type="text" class="form-control" id="employee_name" name="employee_name" required>
                </div>
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="start_time">Start Time:</label>
                    <input type="time" class="form-control" id="start_time" name="start_time" required>
                </div>
                <div class="form-group">
                    <label for="end_time">End Time:</label>
                    <input type="time" class="form-control" id="end_time" name="end_time" required>
                </div>
                <div class="form-group">
                    <label for="role">Role:</label>
                    <input type="text" class="form-control" id="role" name="role" required>
                </div>
                <button type="submit" class="btn btn-primary btn-custom">Schedule Shift</button>
            </form>
        </div>

        <h2>Scheduled Shifts</h2>
        <div id="calendar"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#calendar').fullCalendar({
                header: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'month,agendaWeek,agendaDay'
                },
                events: '/api/shifts',
                editable: true,
                eventClick: function(event) {
                    if (confirm("Are you sure you want to delete this shift?")) {
                        window.location.href = "/delete_shift/" + event.id;
                    }
                }
            });
        });
    </script>
</body>
</html>
