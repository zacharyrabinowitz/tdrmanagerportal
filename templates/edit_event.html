<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        .form-control {
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .btn-save {
            background: #007bff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            width: 100%;
            cursor: pointer;
        }
        .btn-save:hover {
            background: #0056b3;
        }
        .btn-cancel {
            background: #dc3545;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            width: 100%;
            cursor: pointer;
        }
        .btn-cancel:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center">Edit Event</h2>
        <form method="POST">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ event.title }}" required>
            </div>
            <div class="form-group">
                <label for="start">Start Date and Time:</label>
                <input type="datetime-local" class="form-control" id="start" name="start" value="{{ event.start }}" required>
            </div>
            <div class="form-group">
                <label for="end">End Date and Time:</label>
                <input type="datetime-local" class="form-control" id="end" name="end" value="{{ event.end }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea class="form-control" id="description" name="description">{{ event.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-save">Update Event</button>
            <a href="{{ url_for('calendar') }}" class="btn btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
