<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #747679;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: rgb(4, 0, 255);
        }
        .container {
            padding-top: 20px;
        }
        .link-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">The Draft Room Manager Portal: Member Management</a>
            <div class="navbar-nav ml-auto">
                <a class="btn btn-danger" href="/logout" role="button">Logout</a>
                <a href="/user-links" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="link-box">
            <h2>Room 120 Member List</h2>
            <form action="{{ url_for('show_members_page') }}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search by name or email" name="search">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary" type="submit">Search</button>
                    </div>
                </div>
            </form>
            <a href="{{ url_for('add_member') }}" class="btn btn-success mb-3">Add New Member</a>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for member in members %}
                    <tr>
                        <td>{{ member.id }}</td>
                        <td>{{ member.first_name }}</td>
                        <td>{{ member.last_name }}</td>
                        <td>{{ member.email }}</td>
                        <td>
                            <a href="{{ url_for('member_profile', member_id=member.id) }}" class="btn btn-sm btn-info">View Member</a>

                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
