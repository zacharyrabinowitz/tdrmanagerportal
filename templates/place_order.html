<!DOCTYPE html>
<html>
<head>
    <title>Place Order</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            text-align: center;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container">
                <a class="navbar-brand" href="#">The Draft Room Ordering System</a>
                <div class="navbar-nav ml-auto">
                    <a class="btn btn-danger" href="/logout" role="button">Logout</a>
                    <a href="/user-links" class="btn btn-primary">Back to Dashboard</a>
                </div>
            </div>
        </nav>
    
    <div class="container">
        <h2>Place an Order</h2>

        <!-- Your order form here -->
        <form id="orderForm">
            <!-- Add your order form fields here -->
            <div class="form-group">
                <label for="product">Product:</label>
                <input type="text" class="form-control" id="product" name="product" required>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" required>
            </div>
            <!-- Add more form fields as needed -->

            <button type="button" id="placeOrderBtn">Place Order</button>
        </form>
    </div>

    <!-- JavaScript to generate PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script>
        // Function to generate and download PDF
        function generatePDF(orderDetails) {
            // Create a new jsPDF instance
            const doc = new jsPDF();

            // Add content to the PDF
            doc.text('Order Details', 10, 10);
            // Loop through orderDetails and add to PDF
            let y = 20;
            orderDetails.forEach((detail, index) => {
                doc.text(`${index + 1}. Product: ${detail.product}, Quantity: ${detail.quantity}`, 10, y);
                y += 10;
            });

            // Save the PDF with a unique filename
            const filename = 'order.pdf';
            doc.save(filename);
        }

        // Handle button click
        document.getElementById('placeOrderBtn').addEventListener('click', function () {
            const product = document.getElementById('product').value;
            const quantity = document.getElementById('quantity').value;

            // Generate PDF with order details
            generatePDF([{ product, quantity }]);
        });
    </script>
</body>
</html>
