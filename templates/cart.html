<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #747679;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand {
            color: rgb(4, 0, 255);
        }
        .container {
            padding-top: 20px;
        }
        .cart-details {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .cart-details h2 {
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .cart-item-name {
            flex-grow: 1;
        }
        .cart-item-quantity {
            flex-shrink: 0;
        }
        .cart-item-price {
            flex-shrink: 0;
        }
        .total-price {
            font-weight: bold;
        }
        .update-cart-btn {
            background-color: #007bff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }
        .update-cart-btn:hover {
            background-color: #0056b3;
        }
        .place-order-btn {
            background-color: #28a745;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }
        .place-order-btn:hover {
            background-color: #1f8d3e;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">The Draft Room Manager Portal</a>
            <div class="navbar-nav ml-auto">
                <a class="btn btn-danger" href="/logout" role="button">Logout</a>
                <a href="/user-links" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="cart-details">
            <h2>Your Cart</h2>
            <div class="cart-items">
                {% for item in cart_items %}
                <div class="cart-item">
                    <span class="cart-item-name">{{ item['name'] }}</span>
                    <span class="cart-item-quantity">Quantity: {{ item['quantity'] }}</span>
                    <span class="cart-item-price">${{ item['price'] }}</span>
                </div>
                {% endfor %}
            </div>
            <hr>
            <div class="total-price">
                Total: ${{ total_price }}
            </div>
            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-primary update-cart-btn">Update Cart</button>
                <button type="button" class="btn btn-success place-order-btn">Place Order</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
