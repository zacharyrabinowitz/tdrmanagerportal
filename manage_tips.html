<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Draft Room Tip Entry</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #121212;
            color: #ccc;
        }
        .navbar-custom {
            background-color: #343a40;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
        .navbar-custom .navbar-nav .nav-link:hover {
            background-color: #0056b3;
        }
        .container {
            padding-top: 20px;
        }
        .input-section, .buttons {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: #1e1e1e;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #333;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {background-color: #2c2c2c;}
        input[type="text"], input[type="number"], input[type="date"], button {
            padding: 8px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            line-height: 1.5;
            background-color: #333;
            color: #ccc;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .distribute-btn { background-color: #28a745; }
        .add-btn { background-color: #17a2b8; }
        .clear-btn { background-color: #dc3545; }
        .download-btn { background-color: #ffc107; color: black; }
        button:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-coins"></i> The Draft Room Manager Portal: Tip Entry</a>
            <div class="navbar-nav ml-auto">
                <a href="{{ url_for('login') }}" class="btn btn-danger nav-link"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                <a href="{{ url_for('user_links') }}" class="btn btn-primary nav-link"><i class="fas fa-home"></i> Back to Home</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="input-section">
            <label for="datePicker">Select Date:</label>
            <input type="date" id="datePicker" onchange="loadDataForDate()">
            <label>Total Cash Tips: $<input type="number" id="totalCashTips" step="0.01" placeholder="0"></label>
            <label>Total Credit Card Tips: $<input type="number" id="totalCreditCardTips" step="0.01" placeholder="0"></label>
        </div>
        <table id="tipTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Hours Worked</th>
                    <th>Food Expense ($)</th>
                    <th>Cash Tips ($)</th>
                    <th>Credit Card Tips ($)</th>
                    <th>Total Tips ($)</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div class="buttons">
            <button onclick="addRow()" class="add-btn"><i class="fas fa-user-plus"></i> Add Person</button>
            <button onclick="distributeTips()" class="distribute-btn"><i class="fas fa-hand-holding-usd"></i> Distribute Tips</button>
            <button onclick="clearFields()" class="clear-btn"><i class="fas fa-eraser"></i> Clear</button>
            <button onclick="downloadResults()" class="download-btn"><i class="fas fa-download"></i> Download Results</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('datePicker').valueAsDate = new Date();
            clearFields();
        });

        function addRow(data = { name: '', hours: '', foodExpense: '' }) {
            const tableBody = document.querySelector('#tipTable tbody');
            const newRow = tableBody.insertRow();
            newRow.innerHTML = `
                <td><input type="text" class="name" value="${data.name}" placeholder="Name"></td>
                <td><input type="number" class="hours" value="${data.hours}" placeholder="Hours" step="0.01"></td>
                <td><input type="number" class="food-expense" value="${data.foodExpense}" placeholder="0" step="0.01"></td>
                <td class="cash-tips">-</td>
                <td class="credit-card-tips">-</td>
                <td class="total-tips">-</td>
            `;
        }

        function distributeTips() {
            const totalCashTips = parseFloat(document.getElementById('totalCashTips').value) || 0;
            const totalCreditCardTips = parseFloat(document.getElementById('totalCreditCardTips').value) || 0;
            let totalHoursWorked = 0;

            const rows = document.querySelectorAll('#tipTable tbody tr');
            rows.forEach(row => {
                totalHoursWorked += parseFloat(row.querySelector('.hours').value) || 0;
            });

            rows.forEach(row => {
                const hours = parseFloat(row.querySelector('.hours').value) || 0;
                const proportion = hours / totalHoursWorked;
                const foodExpense = parseFloat(row.querySelector('.food-expense').value) || 0;

                const cashTips = (totalCashTips * proportion) - foodExpense;
                const creditCardTips = totalCreditCardTips * proportion;
                const totalTips = Math.max(cashTips + creditCardTips, 0);

                row.querySelector('.cash-tips').textContent = cashTips.toFixed(2);
                row.querySelector('.credit-card-tips').textContent = creditCardTips.toFixed(2);
                row.querySelector('.total-tips').textContent = totalTips.toFixed(2);
            });
        }

        function downloadResults() {
            const selectedDate = document.getElementById('datePicker').value || new Date().toISOString().slice(0, 10);
            let csvContent = "data:text/csv;charset=utf-8,Name,Hours Worked,Food Expense,Cash Tips,Credit Card Tips,Total Tips\n";

            document.querySelectorAll('#tipTable tbody tr').forEach(row => {
                let rowData = [
                    row.querySelector('.name').value,
                    row.querySelector('.hours').value,
                    row.querySelector('.food-expense').value,
                    row.querySelector('.cash-tips').textContent,
                    row.querySelector('.credit-card-tips').textContent,
                    row.querySelector('.total-tips').textContent
                ].join(",");
                csvContent += rowData + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `tip_distribution_${selectedDate}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearFields() {
            document.getElementById('totalCashTips').value = '';
            document.getElementById('totalCreditCardTips').value = '';
            document.querySelector('#tipTable tbody').innerHTML = '';
            addRow(); // Add a blank row to start
        }
    </script>
</body>
</html>
