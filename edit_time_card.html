<!DOCTYPE html>
<html>
<head>
    <title>Edit Time Card</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body { background-color: #f7f7f7; font-family: 'Arial', sans-serif; padding: 20px; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        form { text-align: center; }
        .form-group { text-align: left; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #007bff; border: none; border-radius: 20px; color: white; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Time Card</h2>
        <form action="/edit_time_card/{{ time_card.id }}" method="post">
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" class="form-control" id="date" name="date" value="{{ time_card.date }}" required>
            </div>
            <div class="form-group">
                <label for="hours_worked">Hours Worked:</label>
                <input type="number" class="form-control" id="hours_worked" name="hours_worked" value="{{ time_card.hours_worked }}" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea class="form-control" id="notes" name="notes">{{ time_card.notes }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Time Card</button>
        </form>
    </div>
</body>
</html>
