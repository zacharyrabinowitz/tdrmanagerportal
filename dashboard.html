<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-image: url('c:/Users/Zachary Rabinowitz/Downloads/Feel the Pleasure.png'); /* Update the path to your image */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: 'Arial', sans-serif;
        }
        .navbar-custom {
            background-color: #343a40;
            padding: 10px 0;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
        .container {
            padding-top: 40px;
        }
        .widget {
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 0 10px 0 rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .widget h3 {
            margin-top: 0;
            color: #007BFF;
        }
        .widget p {
            font-size: 24px;
            margin-top: 5px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border-radius: 10px;
        }
        .form-box, .table-responsive {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-box h2, .table-responsive h2 {
            color: #343a40;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-beer"></i> The Draft Room Manager Portal: Live Stats</a>
            <div class="navbar-nav ml-auto">
                <a class="btn btn-danger nav-link" href="/logout" role="button"><i class="fas fa-sign-out-alt"></i> Logout</a>
                <a href="/user-links" class="btn btn-primary nav-link"><i class="fas fa-home"></i> Back to Home</a>
            </div>
        </div>
    </nav>









    
    <div class="container">
        <div class="widget">
            <h3>Total Members</h3>
            <p>{{ total_members }}</p>
        </div>
        <!-- Additional widgets can be added here -->
    </div>

    <div class="footer">
        <p>&copy; 2024 The Draft Room. All rights reserved.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
